name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    name: Generate Profile Assets
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: phatnguyen975
          options: theme=tokyo-night&hide_border=true&area=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: phatnguyen975
          outputs: |
            dist/contribution-snake.svg?color_snake=#f7768e&color_dots=#ffffff,#c3e4fd,#7aa2f7,#3d6fd6,#1a3a8f

      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
